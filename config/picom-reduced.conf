# Vault.OS picom — motion off. a11y on / Reduced copies this over ~/.config/picom.conf.
backend = "glx";
vsync = true;
shadow = false;
shadow-radius = 0;
shadow-opacity = 0;
shadow-offset-x = 0;
shadow-offset-y = 0;
shadow-color = "#001a08";
shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g ?= 'Notify-osd'",
  "class_g = 'Cairo-clock'",
  "class_g = 'xfce4-panel'",
  "_GTK_FRAME_EXTENTS@"
];
fading = false;
fade-in-step = 1.0;
fade-out-step = 1.0;
fade-delta = 1;
inactive-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;
focus-exclude = [ "class_g = 'Cairo-clock'" ];
corner-radius = 0;
rounded-corners-exclude = [ "window_type = 'dock'", "window_type = 'desktop'" ];
blur-background = false;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
use-damage = true;
wintypes: {
  tooltip = { fade = false; shadow = false; opacity = 1.0; focus = true; full-shadow = false; };
  dock = { shadow = false; };
  dnd = { shadow = false; };
  popup_menu = { fade = false; opacity = 1.0; };
  dropdown_menu = { fade = false; opacity = 1.0; };
};
